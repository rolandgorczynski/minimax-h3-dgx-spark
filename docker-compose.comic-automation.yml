# Separate project: docker compose -p comic-automation -f docker-compose.comic-automation.yml up -d --build
services:
  comic-automation:
    build:
      context: ./automation/comics
    image: local/comic-automation:latest
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "${COMIC_AUTOMATION_BIND:-192.168.1.224}:${COMIC_AUTOMATION_PORT:-8090}:8090"
    environment:
      LLM_BACKEND: ${COMIC_AUTOMATION_LLM_BACKEND:-ollama}
      OLLAMA_URL: ${COMIC_AUTOMATION_OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_TEXT_MODEL: ${COMIC_AUTOMATION_OLLAMA_TEXT_MODEL:-gemma3:27b}
      OLLAMA_CRITIC_MODEL: ${COMIC_AUTOMATION_OLLAMA_CRITIC_MODEL:-qwen3.6:35b-a3b}
      OLLAMA_VISION_MODEL: ${COMIC_AUTOMATION_OLLAMA_VISION_MODEL:-qwen3.6:35b-a3b}
      COMFYUI_URL: ${COMIC_AUTOMATION_COMFYUI_URL:-http://comfyui:8188}
      TEXT_MODEL: ${COMIC_AUTOMATION_TEXT_MODEL:-qwen3vl_8b_fp8_scaled.safetensors}
      VISION_MODEL: ${COMIC_AUTOMATION_VISION_MODEL:-qwen3vl_8b_fp8_scaled.safetensors}
      COMFYUI_PROMPT_TIMEOUT: ${COMIC_AUTOMATION_PROMPT_TIMEOUT:-3600}
      API_TOKEN: ${COMIC_AUTOMATION_API_TOKEN:-}
      WORKFLOW_TEMPLATE: /app/workflow_template.json
    volumes:
      - comic-automation-data:/data
      - ./examples/comics/workflows/04_Comic_Automat_9B.json:/app/workflow_template.json:ro
    networks:
      - comfyui
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 10s
    env_file:
      - path: ./automation/comics/.env.telegram
        required: false
networks:
  comfyui:
    external: true
    name: ${COMIC_AUTOMATION_NETWORK:-minimax-h3-dgx-spark_default}
volumes:
  comic-automation-data:
