# Neue Basis für /etc/rsnapshot.conf; Installation bewahrt die vorherige Datei auf.
# Trennzeichen zwischen Schlüssel und Wert müssen echte Tabulatoren sein.
config_version	1.2
snapshot_root	/mnt/backup/docker-offline/
no_create_root	1
cmd_cp	/bin/cp
cmd_rm	/bin/rm
cmd_rsync	/usr/bin/rsync
cmd_logger	/usr/bin/logger
cmd_du	/usr/bin/du
verbose	2
loglevel	3
logfile	/var/log/docker-rsnapshot.log
lockfile	/run/docker-rsnapshot.pid
sync_first	1
retain	weekly	8
rsync_short_args	-aHAX
rsync_long_args	--delete --numeric-ids --relative --delete-excluded
# Absichtlich keine globalen Ausschlüsse: auch Modelle, Caches und Volumes sichern.
# Die backup-Zeilen ergänzt das Steuerskript aus der tatsächlichen Docker-Belegung.
